server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não devolver index.html para .js/.css ausentes (evita MIME text/html em módulos).
    location ~* \.(js|mjs|css|map|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
